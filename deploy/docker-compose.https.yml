# ZError Server + Caddy（自动 HTTPS，需要域名）
#
# 1) deploy/.env 中设置 SITE_ADDRESS=你的域名（DNS 已解析到本机，80/443 可达）
# 2) docker compose -f deploy/docker-compose.https.yml --env-file deploy/.env up -d --build
# 从纯 HTTP 版切换时先停掉旧的：docker compose -f deploy/docker-compose.yml down
services:
  zerror:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: zerror-server:latest
    container_name: zerror
    restart: unless-stopped
    environment:
      ZERROR_DATA_DIR: /data
      ZERROR_BIND: 0.0.0.0:3000
      ZERROR_ADMIN_TOKEN: ${ZERROR_ADMIN_TOKEN:-}
      # 留空则按 Caddy 传来的 X-Forwarded-Proto/Host 自动推断
      ZERROR_PUBLIC_URL: ${ZERROR_PUBLIC_URL:-}
      ZERROR_LOG: ${ZERROR_LOG:-info}
      ZERROR_TRUST_PROXY: "true"
    volumes:
      - ./data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: zerror-caddy
    restart: unless-stopped
    depends_on:
      - zerror
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
