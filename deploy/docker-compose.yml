# ZError Server（纯 HTTP，自定义端口，无反向代理）
#
# 1) cp deploy/env.example deploy/.env   # 修改 PORT / ZERROR_ADMIN_TOKEN
# 2) docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# 访问 http://服务器IP:PORT
#
# 以后需要 HTTPS：改用 deploy/docker-compose.https.yml（内置 Caddy 自动申请证书）。
services:
  zerror:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: zerror-server:latest
    container_name: zerror
    restart: unless-stopped
    environment:
      ZERROR_DATA_DIR: /data
      ZERROR_BIND: 0.0.0.0:3000
      ZERROR_ADMIN_TOKEN: ${ZERROR_ADMIN_TOKEN:-}
      ZERROR_PUBLIC_URL: ${ZERROR_PUBLIC_URL:-}
      ZERROR_LOG: ${ZERROR_LOG:-info}
      # 直接暴露、无代理时不信任 X-Forwarded-For，避免客户端伪造 IP
      ZERROR_TRUST_PROXY: "false"
    volumes:
      - ./data:/data
    ports:
      - "${PORT:-3000}:3000"
