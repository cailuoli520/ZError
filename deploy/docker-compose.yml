# ZError Server + Caddy 反向代理
#
# 无域名（纯 HTTP，用 IP 访问）：   SITE_ADDRESS=:80
# 有域名（自动申请证书，HTTPS）：    SITE_ADDRESS=qa.example.com
# 仅改 deploy/.env 中的 SITE_ADDRESS 并重启 caddy 即可切换，服务端无需改动。
#
# 1) cp deploy/.env.example deploy/.env 并按需填写
# 2) docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  zerror:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: zerror-server:latest
    container_name: zerror
    restart: unless-stopped
    environment:
      ZERROR_DATA_DIR: /data
      ZERROR_BIND: 0.0.0.0:3000
      ZERROR_ADMIN_TOKEN: ${ZERROR_ADMIN_TOKEN:-}
      # 留空则按 Caddy 传来的 X-Forwarded-Proto/Host 自动推断（http 或 https 都能正确生成链接）
      ZERROR_PUBLIC_URL: ${ZERROR_PUBLIC_URL:-}
      ZERROR_LOG: ${ZERROR_LOG:-info}
      ZERROR_TRUST_PROXY: "true"
    volumes:
      - ./data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: zerror-caddy
    restart: unless-stopped
    depends_on:
      - zerror
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
