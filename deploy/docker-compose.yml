# ZError Server + Caddy（自动 HTTPS）
# 1) cp deploy/.env.example deploy/.env 并填写 DOMAIN / ZERROR_ADMIN_TOKEN
# 2) docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  zerror:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: zerror-server:latest
    container_name: zerror
    restart: unless-stopped
    environment:
      ZERROR_DATA_DIR: /data
      ZERROR_BIND: 0.0.0.0:3000
      ZERROR_ADMIN_TOKEN: ${ZERROR_ADMIN_TOKEN:-}
      ZERROR_PUBLIC_URL: https://${DOMAIN}
      ZERROR_LOG: ${ZERROR_LOG:-info}
      ZERROR_TRUST_PROXY: "true"
    volumes:
      - ./data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: zerror-caddy
    restart: unless-stopped
    depends_on:
      - zerror
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
