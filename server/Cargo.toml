[package]
name = "zerror-server"
version = "3.0.0"
edition = "2021"
description = "ZError 题库服务端：OCS 网课助手 AI 题库（VPS 版）"
license = "MIT"

[dependencies]
axum = { version = "0.7", features = ["macros", "json", "query", "multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "set-header"] }
hyper = "1"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
futures = "0.3"
futures-util = "0.3"
bytes = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
jieba-rs = "0.8"
strsim = "0.10"
base64 = "0.22"
url = "2"
urlencoding = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
rand = "0.8"
subtle = "2"
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
once_cell = "1"
async-stream = "0.3"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
strip = true
