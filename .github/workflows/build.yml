name: build

on:
  push:
    branches: [vps-server, master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (linux-x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # ---------- 前端 ----------
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # ---------- 服务端 ----------
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Test server
        working-directory: server
        run: cargo test --release
      - name: Build server (release)
        working-directory: server
        run: cargo build --release
      - name: Smoke test (mock provider)
        working-directory: server
        run: |
          ZERROR_BIN=./target/release/zerror-server bash tests/smoke.sh
          SKIP_RELOAD=1 ZERROR_BIN=./target/release/zerror-server bash tests/smoke_tls.sh

      # ---------- 产物 ----------
      - name: Package
        run: |
          mkdir -p dist
          cp server/target/release/zerror-server dist/
          cp -r deploy dist/
          tar -C dist -czf zerror-server-linux-x86_64.tar.gz zerror-server deploy
          sha256sum zerror-server-linux-x86_64.tar.gz > zerror-server-linux-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: zerror-server-linux-x86_64
          path: |
            zerror-server-linux-x86_64.tar.gz
            zerror-server-linux-x86_64.tar.gz.sha256
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            zerror-server-linux-x86_64.tar.gz
            zerror-server-linux-x86_64.tar.gz.sha256
          generate_release_notes: true
